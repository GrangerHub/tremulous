name: Build Packages for All Platforms

# TODO:
# - Mac/Arm package

# run this workflow only one at a time 
concurrency:
  group: build
  cancel-in-progress: true

on:
  # disable temporarily
  push:
    branches: [ "master" ]
    tags:
      - v1.3.0**
  pull_request:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  set-version:
    runs-on: ubuntu-latest
    
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: set version by tag/branch/ref name
      id: version
      run: |
        echo -n 'version=' >> "$GITHUB_OUTPUT"
        ( ( ${{ startsWith(github.ref, 'refs/tags') }} && echo $GITHUB_REF_NAME ) || \
             ( ${{ startsWith(github.ref_name, 'v1.3.0') }} && echo $GITHUB_REF_NAME ) || \
             ( echo 'v1.3.0-'${GITHUB_SHA:0:8} ) ) >> "$GITHUB_OUTPUT"
    
  build:

    needs: set-version

    strategy:
      fail-fast: false
      matrix:
        release:
          - file: release-linux-x86_64
            name: Linux-x64
            runs-on: ubuntu-latest
            container: debian:stable-slim
          - file: release-mingw32-x86_64
            name: Windows-x32
            runs-on: ubuntu-latest
            container: debian:stable-slim
            platform: mingw32
          - file: release-darwin-arm
            name: Mac-arm
            runs-on: macos-15
            platform: darwin
            ldflags: -ld64
            
    runs-on: ${{ matrix.release.runs-on }}
    container:
      image: ${{ matrix.release.container }}
    
    env:
      VERSION: ${{ needs.set-version.outputs.version }}
      LDFLAGS: ${{ matrix.release.ldflags }}
      TERM: xterm
          
    steps:
    - name: dependencies (linux)
      run: |
        apt update -y
        apt install -y -qq \
          make \
          build-essential \
          cmake \
          pkg-config \
          libgl1-mesa-dev \
          libopenal-dev \
          mingw-w64 \
          libfreetype6-dev \
          zip \
          libcurl4-openssl-dev \
          curl \
          rsync \
          git \
          dos2unix \
          libasound2-dev \
          libpulse-dev \
          libx11-dev \
          libxext-dev \
          libxrandr-dev \
          libxcursor-dev \
          libxfixes-dev \
          libxi-dev \
          libxss-dev \
          libxtst-dev \
          libxkbcommon-dev \
          libdrm-dev \
          libgbm-dev \
          libwayland-dev \
          libdecor-0-dev
      if: ${{ ! contains(matrix.release.runs-on, 'macos') }}
    - name: dependencies (macos)
      run: |
        brew install \
          cmake \
          pkg-config \
          mesa \
          freetype \
          curl \
          rsync \
          dos2unix \
          coreutils \
          sdl3 \
          openal-soft
        # Ensure pkg-config can find Homebrew's SDL3
        echo "PKG_CONFIG_PATH=$(brew --prefix sdl3)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
      if: ${{ contains(matrix.release.runs-on, 'macos') }}
    - name: Git safe directory
      run: git config --global --add safe.directory '*'
    - uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0
    - name: platform
      if: ${{ matrix.release.platform }}
      run: echo "PLATFORM="${{ matrix.release.platform }} >> $GITHUB_ENV
    - name: Fetch and build SDL3
      shell: bash
      run: |
        # Clone SDL3 if not present
        if [ ! -f "external/SDL3/CMakeLists.txt" ]; then
          git clone --depth 1 --branch release-3.4.12 https://github.com/libsdl-org/SDL.git external/SDL3
        fi
        # Build and install SDL3 to /usr/local so pkg-config finds it
        mkdir -p external/SDL3/build
        cd external/SDL3/build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local \
          -DSDL_TESTS=OFF -DSDL_INSTALL_TESTS=OFF -DSDL_EXAMPLES=OFF
        if command -v nproc >/dev/null 2>&1; then
          JOBS=$(nproc)
        elif command -v sysctl >/dev/null 2>&1; then
          JOBS=$(sysctl -n hw.ncpu)
        else
          JOBS=1
        fi
        cmake --build . -j$JOBS
        cmake --install .
        cd ../..
        # Ensure pkg-config finds installed SDL3
        echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
    - name: make
      shell: bash
      run: |
        # Detect CPU count for parallel builds (macOS doesn't have nproc)
        if command -v nproc >/dev/null 2>&1; then
          JOBS=$(nproc)
        elif command -v sysctl >/dev/null 2>&1; then
          JOBS=$(sysctl -n hw.ncpu)
        else
          JOBS=1
        fi
        USE_RESTCLIENT=1 USE_INTERNAL_LUA=1 USE_CURL_DLOPEN=0 make -j$JOBS
    - name: extract pak
      shell: bash
      run: |
        PKG=tremulous-$VERSION-${{ matrix.release.name }}
        echo "PKG="$PKG >> $GITHUB_ENV
        mkdir ./build/$PKG
        pushd ./build/$PKG
        unzip ../${{ matrix.release.file }}.zip
    - name: change perms
      run: chmod -R ugo+rw build
    - name: repack and upload archives
      # only run if this was a tagged release (only works if separate job)
      # if: ( github.event_name == "create" ) && ( github.event.ref_type == 'tag' )
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PKG }}
        # use globbing to include subdir in zip
        path: ./build/${{ env.PKG }}*

